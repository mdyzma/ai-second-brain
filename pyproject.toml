[project]
name = "second-brain"
version = "0.1.0"
description = "Personal AI Second Brain with RAG and dual-memory architecture"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3,<0.4",
    "sentence-transformers>=3.0,<4",
    "anthropic>=0.40,<0.41",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "rich>=13.9,<14",
    "click>=8.1,<9",
    "watchdog>=6.0,<7",
]

[project.scripts]
second-brain = "second_brain.main:cli"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<7",
    "ruff>=0.15,<0.16",
]

[tool.ruff]
target-version = "py312"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
